<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>제재·회원 관리 · Iksan Store 관리자</title>
<link rel="icon" href="images/favicon.png"><link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin-common.css">
<link rel="stylesheet" href="css/admin-sanctions.css">
<script src="js/api.js" defer></script><script src="js/admin-common.js" defer></script><script src="js/admin-sanctions.js" defer></script>
</head>
<body class="admin-sample">
<header class="ai-header"><h1>제재·회원 관리</h1></header>

<section id="login-gate" class="ai-gate">
<p>이 화면은 관리자 로그인 후 접근할 수 있어요.</p>
<button id="btn-admin-login" class="ai-primary">로그인하러 가기</button>
</section>

<div id="app" hidden>
<nav class="ai-tabs" aria-label="관리자 화면"></nav>
<form id="search-form" class="as-search">
  <input type="text" id="user-id-input" placeholder="조회할 userId 입력 (예: 2)" inputmode="numeric">
  <button type="submit">조회</button>
</form>

<div id="result"></div>
</div>

<p id="page-error" role="alert" hidden></p>
<footer class="ai-footer"><span>설계: <a href="https://github.com/adapterz/wku-iksan-store-BE/issues/90">issue #90</a></span></footer>
<div id="toast" role="status" hidden></div>
</body>
</html>
