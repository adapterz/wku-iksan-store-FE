<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장바구니 · 익산 선물</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/cart.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/cart.js" defer></script>
</head>
<body>
<div class="shell">
  <header><a href="/" aria-label="홈으로">←</a><h1>장바구니</h1><span class="header-spacer" aria-hidden="true"></span></header>
  <main>
    <div class="cart-intro"><p class="eyebrow">함께 담아 전하는 마음</p><p class="intro">고른 선물을<br>한 번에 보내세요.</p><p class="muted">선물은 함께 보내고, 교환권은 하나씩 사용해요.</p></div>
    <p id="page-error" role="alert" hidden></p>
    <section id="signed-out" hidden><h2 id="signed-out-title">로그인이 필요해요</h2><p id="signed-out-copy">내 장바구니를 계정에 저장하고 불러옵니다.</p><a id="login" class="button" href="/login">로그인하기</a></section>
    <div id="workspace" hidden>
      <div id="sync-needed" class="notice" role="status" hidden><strong>최신 장바구니 확인이 필요해요.</strong><p>이전 요청이 반영됐을 수 있어 추가 조작을 잠시 멈췄어요.</p><button id="sync-cart" type="button">최신 내용 확인</button></div>
      <fieldset id="controls">
        <section aria-labelledby="cart-list-title">
          <h2 id="cart-list-title">담은 상품 <span id="count">0</span></h2>
          <div class="row list-actions"><label class="grow"><input id="select-all" type="checkbox"> 주문 가능 상품 전체 선택</label><button id="remove-selected" class="text-action" type="button">선택 삭제</button></div>
          <div id="items"></div>
          <div class="list-footer"><p id="quantity-policy" class="muted grow"></p><button id="reload" class="text-action" type="button"><span aria-hidden="true">↻</span> 새로고침</button></div>
        </section>
        <section class="summary"><div class="row"><h2 class="grow">선택 상품 합계</h2><strong id="total">0원</strong></div><p id="units" class="muted">0종 · 교환권 0개</p><div class="row order-actions"><button id="btn-order-self" type="button" class="primary">나에게 선물하기</button><button id="btn-order-gift" type="button" class="primary">선물하기</button></div></section>
      </fieldset>
    </div>
  </main>
</div>
</body>
</html>
