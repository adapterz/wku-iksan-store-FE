<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선물 사용 - Iksan Gift</title>
    <!-- Auth Check & bfcache -->
    <script>
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                document.body.style.visibility = 'hidden';
                document.body.style.opacity = '0';
            }
        });
    </script>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="page-giftuse" style="visibility: hidden; opacity: 0; transition: opacity 0.3s ease;">
    <!-- Main Header -->
    <header class="main-header">
        <!-- Header dynamically injected by component.js -->
    </header>

    <!-- Navigation Bar (Horizontal Scrollable) -->
    <nav class="nav-bar">
        <div class="nav-container nav-container--center">
            <a href="index.html" class="nav-item">홈</a>
            <a href="brand.html" class="nav-item">브랜드</a>
            <a href="ranking.html" class="nav-item">찜 랭킹</a>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="main-content" style="padding-top: 0; padding-bottom: 40px;">
        <!-- User Profile Section -->
        <section class="user-profile-section">
            <div class="profile-img-wrapper">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQceBIRP2B6FYeMIsQBNlnzHnjd6HxqMzoQWiYvOMb0hQ&s=10" alt="프로필" class="profile-img">
                <div id="self-badge" class="profile-badge">나</div>
            </div>
            <div class="user-nickname" id="receiver-nickname">불러오는 중...</div>
        </section>

        <!-- Barcode Card Section -->
        <section class="barcode-card-container">
            <div id="giftuse-delay-state" class="empty-state" style="display: none;">
                <i class="fa-solid fa-clock"></i>
                <p>응답이 지연되고 있어요. 잠시만 기다려 주세요.</p>
            </div>
            <div class="barcode-card" id="barcode-card">
                <!-- Product Image Wrapper for Skeleton -->
                <div id="product-img-wrapper" class="skeleton" style="position: relative; width: 80%; margin: 0 auto 10px; aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden;">
                    <img id="product-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="상품 이미지" class="product-img" style="width: 100%; height: 100%; object-fit: cover; margin-bottom: 0; border-radius: 0px;" onload="this.parentElement.classList.remove('skeleton'); this.classList.add('loaded');" onerror="this.parentElement.classList.remove('skeleton'); this.style.opacity=1;">
                </div>
                
                <div id="product-brand" class="product-brand skeleton" style="min-width: 80px; min-height: 14px; margin-bottom: 4px;">&nbsp;</div>
                <div id="product-name" class="product-name skeleton" style="min-width: 150px; min-height: 20px; margin-bottom: 16px;">&nbsp;</div>
                
                <!-- Barcode Section (Hidden by default, shown when loaded) -->
                <div id="barcode-section" style="width: 100%; display: none; flex-direction: column; align-items: center;">
                    <div class="barcode-img-wrapper">
                        <!-- Standard Barcode Image -->
                        <img src="images/barcode.webp" alt="바코드" class="barcode-img">
                    </div>
                    <!-- 12 digits barcode formatted as XXXX XXXX XXXX -->
                    <div id="barcode-text" class="barcode-text">0000 0000 0000</div>
                </div>
                
                <!-- Barcode Skeleton -->
                <div id="barcode-skeleton" class="skeleton" style="width: 240px; height: 50px; margin-bottom: 16px;"></div>
                
                <button id="btn-use" class="btn-use" disabled>선물 사용하기</button>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Dynamically injected by component.js -->
    </nav>

    
    <!-- Script -->
    <script src="js/skeleton.js"></script>
    <script src="js/api.js"></script>
    <script src="js/component.js" defer></script>
    <script src="js/giftuse.js"></script>
</body>

</html>
