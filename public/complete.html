<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문완료 - Iksan Gift</title>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body class="page-complete">

    <!-- Header -->
    <!-- Main Header -->
    <header class="main-header" style="border-bottom: none;">
        <!-- Header dynamically injected by component.js -->
    </header>

    <main class="main-content" style="padding-top: 0; background-color: transparent;">
        <div class="integrated-card">
            <!-- Message Section -->
            <section class="complete-message-section">
            <div class="profile-image-wrapper">
                <!-- Using a default profile image for now -->
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQceBIRP2B6FYeMIsQBNlnzHnjd6HxqMzoQWiYvOMb0hQ&s=10" alt="프로필" class="profile-img">
                <div id="self-badge" class="profile-badge">나</div>
            </div>
            
            <h2 class="complete-title" id="complete-title">
                <strong>...</strong> 에게<br>
                선물을 보냈습니다.
            </h2>

            <a href="#" class="promo-banner">
                <div class="promo-content">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRU1cI9AEA1YXyWYucCHtRVx1-gJEZS4x36mnhhY9vUhA&s=10" alt="프로모션" class="promo-img">
                    여름필수템 최대 50% 할인
                </div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 12px;"></i>
            </a>
        </section>

        <div class="card-divider"></div>

        <!-- Delivery Address Section -->
        <section class="section-container" id="delivery-section" style="display: none;">
            <div class="section-header">
                <h3 class="section-title">선물배송지</h3>
                <button class="btn-edit-address">배송지 수정</button>
            </div>
            <div style="border-top: 1px solid #f0f0f0; margin-bottom: 16px;"></div>
            <div class="address-info">
                <div>
                    <span class="address-name" id="delivery-name">받는분</span>
                    <span class="address-phone" id="delivery-phone">010-0000-0000</span>
                </div>
                <div class="address-detail" id="delivery-address">
                    주소가 등록되지 않았습니다.
                </div>
            </div>
        </section>

        <div class="card-divider"></div>

        <!-- Sent Gift Section -->
        <section class="section-container">
            <div class="section-header">
                <h3 class="section-title">보낸 선물</h3>
            </div>
            <div style="border-top: 1px solid #f0f0f0; margin-bottom: 16px;"></div>
            <div class="gift-item-card">
                <div class="gift-img-wrapper">
                    <img id="gift-thumbnail" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="상품 썸네일" class="gift-img">
                </div>
                <div class="gift-info">
                    <div class="gift-brand" id="gift-brand">브랜드</div>
                    <div class="gift-name" id="gift-name">상품명</div>
                    <div class="gift-qty">수량 : 1개</div>
                </div>
            </div>
        </section>
            <div class="card-divider"></div>

            <!-- Normal Page Flow Buttons -->
            <div class="bottom-actions">
                <button class="btn-action-left" onclick="location.href='index.html'">홈으로 가기</button>
                <button class="btn-action-right" onclick="location.href='giftbox.html'">선물함 가기</button>
            </div>
        </div>
    </main>

    
    <!-- Script for Data Fetching -->
    <script src="js/api.js"></script>
    <script src="js/component.js" defer></script>
    <script src="js/complete.js"></script>
</body>

</html>
