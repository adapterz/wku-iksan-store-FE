<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 - Iksan Gift</title>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-product">

    <!-- Main Header -->
    <header class="main-header" style="border-bottom: none;">
        <!-- Header dynamically injected by component.js -->
    </header>



    <!-- Main Content Area -->
    <main class="main-content">
        <div id="product-error-state" class="empty-state" style="display: none;">
            <i class="fa-solid fa-clock"></i>
            <p>응답이 지연되고 있어요. 잠시만 기다려 주세요.</p>
        </div>
        <div class="product-detail-card">
            <div class="product-image-container skeleton" id="product-img-wrapper">
                <img id="product-img" src="" alt="상품 이미지" class="product-detail-img" style="display: none;">
            </div>
            <div class="product-info-container">
                <span id="product-brand" class="product-detail-brand skeleton" style="min-width: 60px; min-height: 14px;"></span>
                <h2 id="product-name" class="product-detail-title skeleton" style="min-width: 220px; min-height: 24px; margin-top: 6px;"></h2>
                <div class="product-detail-price-row">
                    <span id="product-price" class="product-detail-price skeleton" style="min-width: 100px; min-height: 22px;"></span>
                    <div class="product-rating-row">
                        <span class="stars">
                            <i class="fa-solid fa-star" style="color: #191919;"></i>
                        </span>
                        <span class="review-count"><span id="review-average" style="color: #191919;">0.0</span>&nbsp;&nbsp;&nbsp;&nbsp;<span id="review-count-text">리뷰 0</span></span>
                    </div>
                </div>
            </div>
            <!-- Product Info Section: 전 상품이 매장 교환형 교환권으로 통일되어(BE #88),
                 배송 전제 문구 대신 교환권 공통 안내로 변경. 매장명·유효기간 등 상품별 세부는
                 상세정보 탭이 담당하므로 여기는 모든 상품에 동일하게 적용되는 문구만 둔다. -->
            <div class="product-detail-section">
                <h3 class="detail-section-title">상품정보</h3>
                <div class="info-list-item">
                    <i class="fa-solid fa-ticket info-icon-blue"></i>
                    <span class="info-text">
                        <strong>교환권 발급</strong> <span class="info-subtext">결제 후 즉시 발급됩니다</span>
                    </span>
                </div>
                <div class="info-list-item">
                    <i class="fa-solid fa-store info-icon-blue"></i>
                    <span class="info-text">매장에서 바코드로 교환·사용</span>
                </div>
            </div>

            <!-- Usage Section -->
            <div class="product-detail-section">
                <h3 class="detail-section-title">사용방법</h3>
                <div class="usage-box">
                    <div class="usage-icon-container">
                        <i class="fa-solid fa-barcode"></i>
                    </div>
                    <span class="usage-text">매장에서 바코드를 제시하고 교환·사용하세요.</span>
                </div>
            </div>

            <!-- Tabs Section -->
            <div class="product-tabs-container">
                <div class="product-tab active" data-tab="description">상품설명</div>
                <div class="product-tab" data-tab="review">선물후기 (<span id="review-tab-count">0</span>)</div>
                <div class="product-tab" data-tab="detail">상세정보</div>
            </div>

            <!-- Tab Panel: 상품설명 -->
            <div class="product-tab-panel" id="tab-panel-description" data-panel="description">
                <div class="tab-panel-description-img-wrapper skeleton" id="product-description-img-wrapper" hidden>
                    <img id="product-description-img" class="tab-panel-description-img" src="" alt=""
                         onload="this.parentElement.classList.remove('skeleton'); this.classList.add('loaded');"
                         onerror="this.parentElement.classList.remove('skeleton'); this.style.opacity=1;">
                </div>
                <p id="product-description" class="tab-panel-description-text"></p>
            </div>

            <!-- Tab Panel: 선물후기 -->
            <div class="product-tab-panel" id="tab-panel-review" data-panel="review" hidden>
                <div class="review-sort-row" id="review-sort-row" hidden>
                    <select id="review-sort" class="review-sort-select" aria-label="후기 정렬">
                        <option value="latest">최신순</option>
                        <option value="rating_desc">별점 높은순</option>
                        <option value="rating_asc">별점 낮은순</option>
                    </select>
                </div>
                <div id="review-list" class="review-list"></div>
                <div class="tab-panel-empty" id="review-empty" hidden>
                    <p>아직 등록된 선물후기가 없습니다.</p>
                </div>
                <p class="review-error" id="review-error" role="alert" hidden></p>
                <button type="button" id="review-more" class="review-more-btn" hidden>후기 더 보기</button>
            </div>

            <!-- Tab Panel: 상세정보 -->
            <div class="product-tab-panel" id="tab-panel-detail" data-panel="detail" hidden>
                <dl class="product-detail-info-list">
                    <div class="detail-info-row">
                        <dt>유효기간</dt>
                        <dd id="product-valid-period">-</dd>
                    </div>
                    <div class="detail-info-row">
                        <dt>사용방법</dt>
                        <dd id="product-usage-method">-</dd>
                    </div>
                    <div class="detail-info-row">
                        <dt>교환처</dt>
                        <dd id="product-exchange-location">-</dd>
                    </div>
                    <div class="detail-info-row">
                        <dt>주의사항</dt>
                        <dd id="product-caution">-</dd>
                    </div>
                </dl>
            </div>

            <!-- Recommended Products: 전체 상품 중 무작위 추천 (product.js에서 채움).
                 홈 화면 둘러보기 상품과 동일한 구조 + 공용 캐러셀(component.js createBrowseCarousel) 재사용 -->
            <div class="product-detail-section" id="product-recommend-section" hidden>
                <h3 class="detail-section-title">추천 상품</h3>

                <div class="browse-cards-viewport">
                    <div class="ranking-cards-row browse-cards-row">
                        <!-- Dynamically loaded -->
                    </div>
                </div>

                <div class="browse-pagination">
                    <button type="button" class="browse-page-btn browse-page-prev" aria-label="이전 페이지">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <span class="browse-page-indicator">1 / 1</span>
                    <button type="button" class="browse-page-btn browse-page-next" aria-label="다음 페이지">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>


    <!-- Product Action Bottom Bar (bottom-nav 틀 재사용) -->
    <nav class="bottom-nav product-bottom-nav">
        <button class="bottom-action-item" aria-label="저장">
            <i class="fa-regular fa-bookmark"></i>
        </button>
        <button id="btn-self-gift" class="btn-bottom-buy">나에게 선물하기</button>
        <button id="btn-gift" class="btn-bottom-gift">선물하기</button>
    </nav>

    <!-- Script for Interactions -->
    <script src="js/skeleton.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/review.js" defer></script>
    <script src="js/component.js" defer></script>
    <script src="js/product.js" defer></script>

</body>

</html>
