<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 마이페이지 ui 글꼴 bold체 없애기 */
        .tab-btn.active, 
        .profile-nickname, 
        .profile-stats strong, 
        .action-btn, 
        .grid-text, 
        text, 
        .section-title, 
        .history-count, 
        .cs-title, 
        .cs-btn, 
        .nav-text, 
        .policy-item, 
        .history-label {
            font-weight: 400 !important;
        }
    </style>
</head>
<body>
    <!-- Header Area -->
    <header class="mypage-header">
        <button class="icon-btn" aria-label="설정">
            <i class="fa-solid fa-gear"></i>
        </button>
        <div class="header-tabs">
            <span class="tab-title" style="font-size: 18px; font-weight: 700;">마이페이지</span>
        </div>
        <button class="icon-btn" aria-label="선물함" onclick="location.href='giftbox.html'">
            <i class="fa-solid fa-gift"></i>
        </button>
    </header>
    <!-- Profile Area -->
    <section class="profile-section">
        <div class="profile-info-row">
            <div class="profile-img-container">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQceBIRP2B6FYeMIsQBNlnzHnjd6HxqMzoQWiYvOMb0hQ&s=10" alt="프로필 이미지" class="profile-img">
            </div>
            <div class="profile-details">
                <h2 class="profile-nickname">
                    <span id="display-nickname"></span>
                </h2>
                <div class="profile-stats">
                    <span>팔로워 <strong>0</strong></span>
                    <span class="stat-divider">|</span>
                    <span>팔로잉 <strong>0</strong></span>
                </div>
            </div>
        </div>
        <div class="profile-actions">
            <button class="action-btn">프로필 관리</button>
            <button class="action-btn">프로필 공유</button>
        </div>
    </section>

    <!-- Divider -->
    <div class="thick-divider"></div>

    <!-- Unused Gifts Area -->
    <section class="unused-gifts-section">
        <h3 class="section-title">
            미사용 선물 <span id="unused-gifts-count" class="highlight-count" style="color: #f15746;">0</span>
        </h3>
        <div class="unused-gifts-scroller" id="unused-gifts-list">
            <!-- Cards will be populated here by JS -->
        </div>
    </section>

    <!-- Divider (1) -->
    <div class="thick-divider"></div>

    <!-- Purchase History Area -->
    <section class="history-section">
        <h3 class="section-title">구매 내역</h3>
        <div class="history-box">
            <a href="#" class="history-item">
                <span class="history-label">전체</span>
                <span class="history-count highlight-count">0</span>
            </a>
            <a href="#" class="history-item">
                <span class="history-label">나에게 선물</span>
                <span class="history-count">0</span>
            </a>
            <a href="#" class="history-item">
                <span class="history-label">받은 선물</span>
                <span class="history-count">0</span>
            </a>
            <a href="#" class="history-item">
                <span class="history-label">사용 완료</span>
                <span class="history-count">0</span>
            </a>
        </div>
    </section>

    <!-- Divider (2) -->
    <div class="thick-divider"></div>

    <!-- Divider (3) -->
    <div class="thick-divider"></div>

    <!-- Customer Service Area -->
    <section class="cs-section">
        <h3 class="cs-title">고객센터 1588-1111</h3>
        <p class="cs-desc">운영시간 평일 10:00 - 19:00 (토,일 | 공휴일 휴무)</p>
        <p class="cs-desc">점심시간 평일 13:00 - 14:00</p>

        <div class="cs-buttons">
            <a href="#" class="cs-btn">이용 정책</a>
            <a href="#" class="cs-btn black-btn">패널티 정책</a>
            <a href="#" class="cs-btn">개인정보처리방침</a>
        </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Dynamically injected by component.js -->
    </nav>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="settings-overlay">
        <div class="settings-overlay-header">
            <button id="btn-settings-close" class="btn-settings-back" aria-label="뒤로가기">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="settings-overlay-title">설정</h2>
        </div>
        <div class="settings-overlay-body">
            <!-- 일반 -->
            <div class="settings-section">
                <h3 class="settings-section-title">일반</h3>
                <div class="settings-list">
                    <a href="#" class="settings-item">로그인 정보</a>
                    <a href="#" class="settings-item">주소록</a>
                    <a href="#" class="settings-item">간편결제 카드 관리</a>
                    <a href="#" class="settings-item">판매 정산 계좌 관리</a>
                    <a href="#" class="settings-item">현금영수증 관리</a>
                    <a href="#" class="settings-item">로그인기기 관리</a>
                    <a href="#" class="settings-item">나의 맞춤 정보</a>
                    <a href="#" class="settings-item">알림</a>
                </div>
            </div>
            <!-- 정보 -->
            <div class="settings-section">
                <h3 class="settings-section-title">정보</h3>
                <div class="settings-list">
                    <a href="#" class="settings-item">이용 약관</a>
                    <a href="#" class="settings-item">개인정보처리방침</a>
                    <a href="#" class="settings-item">오픈소스 라이선스</a>
                    <a href="#" class="settings-logout">로그아웃</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Search Overlay UI -->
    <div id="search-overlay" class="search-overlay">
        <div class="search-overlay-header">
            <button id="btn-search-close" class="btn-search-back" aria-label="뒤로가기">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-overlay-input-icon"></i>
                <input type="text" class="search-overlay-input" placeholder="원하는 선물을 검색해보세요" autofocus>
            </div>
        </div>
        <div class="search-overlay-body">
            <h4 class="recent-searches-title">최근 검색어</h4>
        </div>
    </div>

    <!-- JS -->
    <script src="js/skeleton.js"></script>
    <script src="js/api.js"></script>
    <script src="js/component.js" defer></script>
    <script src="js/mypage.js" defer></script>
</body>
</html>
