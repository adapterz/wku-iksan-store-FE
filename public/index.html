<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="apple-touch-icon" href="/images/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iksan Gift</title>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Header -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-search-box" id="btn-search-open" style="cursor: text;">
                <span class="header-search-text">브랜드, 상품, 프로필, 태그 등</span>
                <div class="header-search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            
            <div class="header-right-icons">

                <a href="giftbox.html" class="header-icon" title="선물함">
                    <i class="fa-solid fa-gift"></i>
                </a>
            </div>


        </div>
    </header>

    <!-- Navigation Bar (Horizontal Scrollable) -->
    <nav class="nav-bar">
        <div class="nav-container">
            <a href="#" class="nav-item">for you</a>
            <a href="index.html" class="nav-item active">홈</a>
            <a href="brand.html" class="nav-item">브랜드</a>
            <a href="ranking.html" class="nav-item">실시간 랭킹</a>
            <a href="#" class="nav-item">인기상권</a>
            <a href="#" class="nav-item">익산역 맛집거리</a>
            <a href="#" class="nav-item">익산역 쇼핑거리</a>
            <a href="#" class="nav-item">익산역 선물거리</a>
            <a href="#" class="nav-item">청년상점거리</a>
            <a href="#" class="nav-item">역세권 금액권</a>
        </div>
    </nav>

    <!-- Ad Banner Slider -->
    <section class="ad-banner-section">
        <div class="ad-banner-slider">
            <div class="ad-banner-slides">
                <img src="./images/banner_1.webp" alt="Ad Banner 1" data-product-id="2">
                <img src="./images/banner_2.webp" alt="Ad Banner 2" data-product-id="5">
                <img src="./images/banner_3.webp" alt="Ad Banner 3" data-product-id="16">
                <img src="./images/banner_4.webp" alt="Ad Banner 4" data-product-id="14">
                <img src="./images/banner_5.webp" alt="Ad Banner 5" data-product-id="18">
                <img src="./images/banner_6.webp" alt="Ad Banner 6" data-product-id="7">
            </div>
            <button class="ad-banner-btn prev-btn" aria-label="이전 배너">&lt;</button>
            <button class="ad-banner-btn next-btn" aria-label="다음 배너">&gt;</button>
        </div>
    </section>


    <!-- Main Content Area -->
    <main class="main-content">

        <!-- Category Grid (8 Columns Horizontal Scroll Layout) -->
        <!-- 카테고리 카드는 home.js의 loadCategories()가 GET /api/categories 응답으로 동적으로 채운다. -->
        <section class="category-section">
            <div class="category-grid">
                <a href="category.html" class="category-card category-more">
                    <div class="category-icon-wrapper" style="border: 1px solid #EAEAEA; border-radius: 50%; width: 48px; height: 48px; background-color: #fff;">
                        <i class="fa-solid fa-chevron-right" style="color: #666; font-size: 14px;"></i>
                    </div>
                    <span class="category-name">더보기</span>
                </a>
            </div>
        </section>

        <!-- Section 1: 둘러보기 상품 1 -->
        <section class="horizontal-product-section">
            <div class="ranking-title-container">
                <h3 class="ranking-title">둘러보기 상품 1</h3>
            </div>
            <div class="horizontal-product-list" id="horizontal-list-1">
                <!-- Dynamically loaded -->
            </div>
        </section>

        <!-- Section 2: 둘러보기 상품 2 -->
        <section class="horizontal-product-section">
            <div class="ranking-title-container">
                <h3 class="ranking-title">둘러보기 상품 2</h3>
            </div>
            <div class="horizontal-product-list" id="horizontal-list-2">
                <!-- Dynamically loaded -->
            </div>
        </section>

        <section class="ranking-section">
            <div class="ranking-title-container">
                <h3 class="ranking-title" id="recommendation-title">회원님을 위한 추천 상품</h3>
            </div>

            <!-- Segment Filter (Removed) -->
            <!-- Filter Tabs (Removed) -->
            <!-- Price Filter Pills (Removed) -->

            <!-- Ranking Cards Row -->
            <div class="ranking-cards-row">
                <!-- Dynamically loaded via API -->
            </div>

            <!-- More Button Container -->
            <div class="ranking-more-container">
                <button id="btn-ranking-more" class="btn-ranking-more">
                    더보기 <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>
        </section>


    </main>



    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Dynamically injected by component.js -->
    </nav>

    
    <!-- Script for Interactions -->
    <script src="js/skeleton.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/component.js" defer></script>
    <script src="js/home.js" defer></script>

</body>

</html>
