<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선물함 - Iksan Gift</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f5f5f5;
            max-width: 430px;
            margin: 0 auto;
            position: relative;
        }
        .tabs-container {
            display: flex;
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 15px;
            color: var(--text-sub);
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
        }
        .tab-btn.active {
            color: #191919;
            font-weight: 700;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #191919;
        }
        
        .integrated-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin: 20px 16px;
            overflow: hidden;
        }
        .gift-list {
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .gift-card {
            background-color: #fff;
            border-radius: 0;
            padding: 16px 20px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            box-shadow: none;
            border-bottom: 1px solid #EAEAEA;
        }
        .gift-card:last-child {
            border-bottom: none;
        }
        .gift-img-wrapper {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }
        .gift-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .used-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }
        .gift-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }
        .gift-brand {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .gift-name {
            font-size: 14px;
            color: #191919;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .gift-sender-info {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .gift-date {
            font-size: 11px;
            color: var(--text-muted);
        }
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
        }
        .skeleton-gift-card {
            display: flex;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid #EAEAEA;
        }
        .skeleton-gift-card .skeleton-gift-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .skeleton-gift-card .skeleton-gift-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }
        .skeleton-gift-card .skeleton-line {
            height: 12px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <!-- Main Header -->
    <!-- Main Header -->
    <header class="main-header" style="border-bottom: none;">
        <!-- Header dynamically injected by component.js -->
    </header>

    <!-- Main Content Area -->
    <main class="main-content" style="padding-bottom: 70px; padding-top: 0;">
        <div class="integrated-card">
            <div class="tabs-container">
                <button class="tab-btn active" id="tab-unused">미사용</button>
                <button class="tab-btn" id="tab-used">사용완료</button>
            </div>

            <div class="gift-list" id="gift-list-container">
                <!-- Gift cards will be injected here by JS -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <!-- Dynamically injected by component.js -->
    </nav>

    
    <!-- Script -->
    <script src="js/skeleton.js"></script>
    <script src="js/api.js"></script>
    <script src="js/component.js" defer></script>
    <script src="js/giftbox.js"></script>
</body>

</html>
