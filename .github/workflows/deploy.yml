name: Deploy FE

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Private Registry 로그인
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.iksan.store -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: 이미지 빌드 및 푸시
        run: |
          docker build -t registry.iksan.store/wku-iksan-store-fe:latest .
          docker push registry.iksan.store/wku-iksan-store-fe:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: FE 서버에 SSH 접속해 재배포 (Nginx 경유)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FE_HOST }}
          username: ${{ secrets.FE_USER }}
          key: ${{ secrets.CICD_SSH_KEY }}
          proxy_host: ${{ secrets.NGINX_HOST }}
          proxy_username: ${{ secrets.NGINX_USER }}
          proxy_key: ${{ secrets.CICD_SSH_KEY }}
          script: |
            cd ~/wku-iksan-store-FE
            ./deploy.sh
